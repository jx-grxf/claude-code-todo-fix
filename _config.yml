title: Claude Code Todo Fix
description: >-
  Unofficial fix to bring the todo and task list back to Claude Code 2.1.233+
  on Opus 4.8, Sonnet 5, Fable 5 and newer models (CLAUDE_CODE_ENABLE_TODO_TOOLS,
  TodoWrite, TaskCreate).
lang: en_US
theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - lib/
  - test/
  - install.sh
  - uninstall.sh
